name: natixis-integrador

services:
  api:
    build: .
    image: natixis-support:local
    ports:
      - "127.0.0.1:18080:8000"
    environment:
      SERVICE_NAME: support-api-integrador
      DATA_DIR: /data
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  checker:
    image: curlimages/curl:8.11.1
    profiles: ["diagnostico"]
    depends_on:
      api:
        condition: service_healthy   

volumes:
  app-data:
